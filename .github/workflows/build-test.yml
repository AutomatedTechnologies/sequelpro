name: Sequel Pro Academy RC build

on:
  push:
    branches: [build-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcodebuild -showsdks

      - name: List schemes (sanity)
        run: |
          xcodebuild -project sequel-pro.xcodeproj -list


      - name: Verify notification identity + intermediary excision source (SDS-10 10.6)
        run: |
          # SDS-10 10.6 both halves. First half: the attributed name is
          # the ship name, read from the main bundle at runtime.
          # Second half (10.6.5): NO third-party notification
          # intermediary -- Growl (separate app, retired 2020,
          # self-asserted unauthenticated sender identity) is excised;
          # posting is native NSUserNotificationCenter from the main
          # bundle via SPNotificationController.
          F="Source/SPNotificationController.m"
          H="Source/SPNotificationController.h"
          test -f "$F" && test -f "$H"
          grep -q 'NSUserNotificationCenter' "$F"
          grep -q 'deliverNotification' "$F"
          grep -q 'notificationApplicationName' "$F"
          grep -q 'CFBundleName' "$F"
          if grep -rq 'Growl' Source/ Interfaces/English.lproj/Preferences.xib Resources/Plists/ sequel-pro.xcodeproj/project.pbxproj; then echo "FAIL: Growl remnant in app source/project/plists"; exit 1; fi
          for pat in 'GrowlApplicationBridge' 'GNTP' 'applicationNameForGrowl' 'registrationDictionaryForGrowl' 'GROWL_IS_READY'; do
            if grep -rq "$pat" Source/ sequel-pro.xcodeproj/; then echo "FAIL: intermediary remnant: $pat"; exit 1; fi
          done
          if [ -e "Frameworks/Growl.framework" ]; then echo "FAIL: Frameworks/Growl.framework still in tree"; exit 1; fi
          if [ -e "Resources/Growl Registration Ticket.growlRegDict" ]; then echo "FAIL: Growl registration ticket still in tree"; exit 1; fi
          NI=$(/usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance:NotificationIdentity" Resources/Plists/Info.plist)
          CD=$(/usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance:Date" Resources/Plists/Info.plist)
          echo "Conformance source check: NotificationIdentity=$NI Date=$CD"
          test "$NI" = "true" && test "$CD" = "2026-11-13"
          echo "Notification identity + excision source gate: PASS (native posting, ship name from main bundle, no intermediary)"

      - name: Apply CI source patch (SPLogger struct direct -> dirent)
        run: |
          # SPLogger.m uses the pre-modern `struct direct` spelling (3 sites:
          # decl, local var, definition). The macOS 15 SDK no longer defines
          # struct direct; struct dirent is the same type on 10.13 and modern
          # SDKs. Patch is applied to the checked-out working tree only,
          # guarded: fails unless exactly 3 sites before and 0 remain after.
          F="Source/SPLogger.m"
          BEFORE=$(grep -c 'struct direct' "$F")
          perl -pi -e 's/\bstruct direct\b/struct dirent/g' "$F"
          AFTER=$(grep -c 'struct dirent' "$F" || true)
          LEFT=$(grep -c 'struct direct' "$F" || true)
          echo "SPLogger.m CI patch: sites_before=$BEFORE dirent_after=$AFTER leftover=$LEFT"
          test "$BEFORE" = "3" && test "$AFTER" = "3" && test "$LEFT" = "0"

      - name: Build Sequel Pro (Release, unsigned, 10.13 floor, x86_64)
        run: |
          set -o pipefail
          xcodebuild -project sequel-pro.xcodeproj -scheme "Sequel Pro" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            OTHER_CFLAGS="-Wno-error=return-mismatch" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload full xcodebuild log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Stamp CFBundleVersion + bundle Academy IP texts (T2)
        if: success()
        run: |
          APP=$(find ./DerivedData -name 'Sequel Pro.app' -path '*Release*' | grep -v '\.dSYM' | head -1)
          echo "Stamping app: $APP"
          test -n "$APP"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string sequelpro-test-${{ github.run_number }}" "$PLIST"
          cp LICENSE-ACADEMY.txt NOTICE.txt "$APP/Contents/Resources/"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance" "$PLIST"
          NI=$(/usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance:NotificationIdentity" "$PLIST")
          CD=$(/usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance:Date" "$PLIST")
          echo "Conformance: NotificationIdentity=$NI Date=$CD"
          test "$NI" = "true" && test "$CD" = "2026-11-13"
          /usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.audit" "$PLIST"
          test -f "$APP/Contents/Resources/startup-sound.wav"
          shasum -a 256 "$APP/Contents/Resources/startup-sound.wav"
          test "$(shasum -a 256 "$APP/Contents/Resources/startup-sound.wav" | awk '{print $1}')" = "07a113244c6b432b22954a089ce519bd239311b14a48f26ae85214ed8c25b09a"
          ls -la "$APP/Contents/Resources/LICENSE-ACADEMY.txt" "$APP/Contents/Resources/NOTICE.txt"

      - name: Package app as zip
        if: success()
        run: |
          APP=$(find ./DerivedData -name 'Sequel Pro.app' -path '*Release*' | grep -v '\.dSYM' | head -1)
          echo "Built app: $APP"
          test -n "$APP"
          test -x "$APP/Contents/MacOS/Sequel Pro"
          file "$APP/Contents/MacOS/Sequel Pro"
          # Intermediary excision assertion (SDS-10 10.6.5): the shipped
          # bundle carries no Growl framework or registration ticket,
          # and the executable neither links nor references the
          # intermediary -- while the native center path is present.
          test ! -e "$APP/Contents/Frameworks/Growl.framework"
          test ! -e "$APP/Contents/Resources/Growl Registration Ticket.growlRegDict"
          test -z "$(find "$APP" -iname '*growl*' -print -quit)"
          if otool -L "$APP/Contents/MacOS/Sequel Pro" | grep -qi growl; then echo "FAIL: binary links Growl"; exit 1; fi
          if strings "$APP/Contents/MacOS/Sequel Pro" | grep -q 'Growl'; then echo "FAIL: binary references Growl"; exit 1; fi
          if strings "$APP/Contents/MacOS/Sequel Pro" | grep -q 'GNTP'; then echo "FAIL: binary references GNTP"; exit 1; fi
          if strings "$APP/Contents/MacOS/Sequel Pro" | grep -q 'applicationNameForGrowl'; then echo "FAIL: binary references applicationNameForGrowl"; exit 1; fi
          strings "$APP/Contents/MacOS/Sequel Pro" | grep -q 'NSUserNotificationCenter'
          strings "$APP/Contents/MacOS/Sequel Pro" | grep -q 'SPNotificationController'
          echo "Growl excision bundle assertion: PASS (no framework, no ticket, no link, no intermediary strings; native center present)"
                    ditto -c -k --keepParent "$APP" SequelPro-test.zip
          ls -la SequelPro-test.zip
          shasum -a 256 SequelPro-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sequelpro-test-zip
          path: SequelPro-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sequelpro-test-${{ github.run_number }} SequelPro-test.zip \
            --prerelease \
            --title "Sequel Pro — Academy test build ${{ github.run_number }} (SDS-10 10.6 notification intermediary excision)" \
            --notes "Growl excision build (SDS-10 10.6, finding S-02): the retired third-party Growl notification intermediary is removed (framework, registration ticket, preference surface); SPNotificationController posts natively via NSUserNotificationCenter from the main bundle, banner title read from the bundle Info.plist at runtime, same six notification types; conformance key gains NotificationIdentity=true (Date 2026-11-13). Prior SDS10-T4 conformance retained:  SDS-8 welcome screen (SPWelcomeController — AppIcon composition, version line runtime-read from the bundle Info.plist CFBundleVersion) + byte-identical startup-sound.wav (SHA-256 07a113244c6b432b22954a089ce519bd239311b14a48f26ae85214ed8c25b09a) + com.detroitautomationacademy.conformance key (SDS-10: Logo/VersionAtStartup/StartupSound/MenuBar all true). Academy bundle ID com.detroitautomationacademy.sequelpro + complete Academy audit entry in the app Info.plist. Database layer unchanged in this tranche. NOT rig-verified on High Sierra. Known limitation: MySQL connector is the bundled EOL 5.5.56 client — no caching_sha2_password. Findings F-01/F-02/F-03 remain OPEN. NOT A RELEASE."
